name: flutter_midi_command_plus
description: "A new Flutter plugin project."
version: 0.0.1
homepage: https://github.com/renanyoy/flutter_midi_command_plus
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  collection: any
  plugin_platform_interface: ^2.0.2
  bb_dart:
    git: https://github.com/aestesis/bb.dart.git
  bb.flutter:
    git: https://github.com/aestesis/bb.flutter.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: org.aestesis.flutter_midi_command_plus
        pluginClass: FlutterMidiCommandPlusPlugin
      ios:
        pluginClass: FlutterMidiCommandPlusPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: FlutterMidiCommandPlusPlugin
        sharedDarwinSource: true

